<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.3/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5.sound@0.4.1/dist/p5.sound.min.js"></script>
    
    
    
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="utf-8" />

  </head>
  <body>
    <h1 class = "title">Flow/SPSL 1.0</h1>
        <p>How to use</p>
        <ul>
            <li>Click on the top textbox to insert code. I'll include instructions later.</li>
            <li>The bottom textbox will be your console.</li>
          <li>The tokens part is for tokens. 🤯</li>
        </ul>
    <main>
      <textarea id="input" placeholder="Type in your code..." class="a"></textarea>
      <textarea id="console" class="b"></textarea>
      <button id="runCode">Run code</button>
      <button id="clearCode">Clear code</button>
      <button id="clearConsole">Clear console</button>
      <textarea id="tokens" placeholder="tokens" readonly></textarea>
    </main>
    <script src="script.js"></script>
  </body>
